name: Forced Generative Loop (24/7)

# The sandbox is session-scoped, so the always-on search runs here instead:
# a scheduled job that keeps composing and proving intents even between
# sessions, and records every result to the evidence ledger.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:
    inputs:
      intent:
        description: "Arabic intent to synthesize"
        required: false
        default: "اريد ربح 100 دولار من سوق السيولة بدون مفتاح وبدون راس مال"

permissions:
  contents: write

concurrency:
  group: synthesis-loop
  cancel-in-progress: false

jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        # requirements.txt pulls the cvc5 Python bindings, so the independent
        # second prover is available in CI as well as locally.
        run: pip install -r requirements.txt -r requirements-eth.txt

      - name: Run the synthesis loop on the seed intents
        env:
          SYNTH_ALWAYS_ON: "true"
          SYNTH_LOOP_BUDGET: "120"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/synthesis_batch.py

      # The loop does the work; this is what makes it visible. Without it the
      # settlements land on the runner's chain and die with the runner, and the
      # permanent link keeps showing whatever an earlier run happened to commit.
      #
      # This job does not provision a node, so its own chain is gone by the time
      # the snapshot is built and it will usually verify nothing. Publishing that
      # would replace a snapshot full of checkable ids with an empty one, so a
      # run that verifies less than what is already published leaves it alone.
      - name: Publish what the chain confirmed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          before=$(python -c "import json;print(json.load(open('docs/state.json'))['settled_count'])" 2>/dev/null || echo 0)
          python scripts/publish_snapshot.py
          after=$(python -c "import json;print(json.load(open('docs/state.json'))['settled_count'])")
          echo "verified now: $after (published before: $before)"
          if [ "$after" -lt "$before" ]; then
            echo "this run verifies fewer settlements than the published snapshot; keeping it"
            git checkout -- docs/state.json docs/health.json
            exit 0
          fi
          git config user.name "engine"
          git config user.email "engine@users.noreply.github.com"
          git add docs/state.json docs/health.json
          if git diff --cached --quiet; then
            echo "no change in what the chain confirms"
            exit 0
          fi
          git commit -m "Publish the settlements this run confirmed"
          git push

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthesis-evidence
          path: evidence/
          if-no-files-found: warn
