name: Permanent deploy

# Every push to the default branch redeploys the whole stack, so the link never
# goes stale and never depends on a sandbox that has already died.
#
# Three artefacts come out of one run:
#   1. the static client  -> GitHub Pages (the permanent, shareable URL)
#   2. the engine image   -> GHCR (a permanent, pullable reference)
#   3. a live smoke test  -> proves the published client answers

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: permanent-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      # snarkjs is what actually produces a proof, and the circuit artefacts are
      # committed. Without the node packages the ZK tests can only skip, which
      # would quietly stop the deploy from checking the proof path at all.
      - run: npm install --no-audit --no-fund
      - run: pip install -r requirements-test.txt
      - name: The suite gates the deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pytest tests/ -q

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the engine image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pages:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Prove the published client answers
        run: |
          set -eu
          url="${{ steps.deploy.outputs.page_url }}"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
          echo "published client: $url -> HTTP $code"
          test "$code" = "200"
