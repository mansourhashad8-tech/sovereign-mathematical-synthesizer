app = "sovereign-synthesizer"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SYNTH_PORT = "8000"
  SYNTH_ALWAYS_ON = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
